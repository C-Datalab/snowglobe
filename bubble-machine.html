<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ectoplasm Engine</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Eater&family=Jolly+Lodger&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-top: #0b0b1a;
    --bg-bottom: #1a0f2e;
    --ghost: #cfe8ff;
    --ecto: #59e88f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(ellipse at top, var(--bg-bottom), var(--bg-top) 70%);
    color: #b8a8d8;
    font-family: 'IM Fell English', serif;
    min-height: 100vh;
    overflow: hidden;
  }
  h1 {
    position: fixed;
    top: clamp(10px, 2.5vh, 28px);
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Eater', cursive;
    font-weight: 400;
    font-size: clamp(1.4rem, 4.5vmin, 2.8rem);
    color: #8f7bb8;
    text-shadow: 0 0 18px rgba(140, 100, 220, 0.5);
    letter-spacing: 0.06em;
    white-space: nowrap;
    z-index: 30;
  }

  /* ---- the contraption: dominates bottom-left ---- */
  .machine {
    position: fixed;
    left: 0;
    bottom: 0;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    z-index: 10;
  }
  .machine video {
    display: block;
    width: auto;
    height: auto;
    max-width: min(64vw, 1100px);
    max-height: 82vh;
    /* feather the video rectangle's top/right edges into the page */
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 36px), transparent),
                        linear-gradient(to top,   #000 calc(100% - 36px), transparent);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(to right, #000 calc(100% - 36px), transparent),
                linear-gradient(to top,   #000 calc(100% - 36px), transparent);
    mask-composite: intersect;
  }
  /* colour-matched halo: melts the video's flat backdrop into the page gradient */
  .halo {
    position: fixed;
    left: -18vw;
    bottom: -18vh;
    width: 96vw;
    height: 112vh;
    background: radial-gradient(ellipse at 32% 72%, #100d20 46%, rgba(16,13,32,0) 73%);
    z-index: 5;
    pointer-events: none;
  }
  /* the machine itself never moves as a whole — it runs (video plays)
     only while producing a bubble, then stops */

  /* --- overlays pinned to fractions of the artwork --- */
  .fx {
    position: absolute;
    pointer-events: none;
    transform: translate(-50%, -50%);
  }
  /* cauldron surge on run (the idle simmer is baked into the video) */
  .cauldron-glow {
    left: 72.4%; top: 81.6%;
    width: 22%; aspect-ratio: 1.6 / 1;
    background: radial-gradient(ellipse at center, rgba(90, 232, 143, 0.45) 0%, rgba(90, 232, 143, 0.12) 55%, transparent 75%);
    filter: blur(6px);
    opacity: 0;
    mix-blend-mode: screen;
  }
  .machine.run .cauldron-glow { animation: glowSurge 1.9s ease-in-out; }
  @keyframes glowSurge {
    0%, 100% { opacity: 0; transform: translate(-50%,-50%) scale(1); }
    70% { opacity: 1; transform: translate(-50%,-50%) scale(1.25); }
  }
  /* soap puffs at the wand ring during a launch */
  .puff {
    left: 92.1%; top: 9.3%;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(210,235,255,0.8), rgba(140,255,200,0.15) 70%);
    opacity: 0;
  }
  .machine.run .puff  { animation: puffOut 0.6s ease-out 1.6s; }
  .machine.run .puff2 { animation-delay: 1.72s; width: 18px; height: 18px; left: 93.2%; top: 7.6%; }
  @keyframes puffOut {
    0% { opacity: 0.9; transform: translate(-50%,-50%) scale(0.4); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1.8); }
  }

  /* ---- the bubbles ---- */
  .bub-pos { position: fixed; left: 0; top: 0; z-index: 20; pointer-events: none; will-change: transform; }
  .bubble {
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,0.45) 0%, rgba(200,225,255,0.10) 20%, rgba(150,120,255,0.07) 52%, rgba(120,255,200,0.09) 76%, rgba(255,255,255,0.20) 96%);
    border: 1px solid rgba(220, 235, 255, 0.35);
    box-shadow:
      inset -8px -10px 24px rgba(120, 100, 220, 0.18),
      inset 6px 8px 18px rgba(255, 255, 255, 0.14),
      0 0 18px rgba(150, 180, 255, 0.25);
  }
  .bubble .bname {
    font-family: 'Jolly Lodger', 'IM Fell English', serif;
    color: #dff0ff;
    letter-spacing: 0.06em;
    text-align: center;
    text-shadow: 0 0 10px rgba(190, 220, 255, 0.9), 0 0 24px rgba(140, 180, 255, 0.5);
  }
  .bubble.docked { animation: bob 4.2s ease-in-out infinite alternate; }
  @keyframes bob {
    from { transform: translateY(-4px); }
    to   { transform: translateY(5px); }
  }
  .bubble.popping { animation: pop 0.3s ease-out forwards; }
  @keyframes pop {
    0%   { transform: scale(1); opacity: 1; }
    55%  { transform: scale(1.22); opacity: 1; box-shadow: 0 0 34px rgba(200, 225, 255, 0.8); }
    100% { transform: scale(1.5); opacity: 0; }
  }

  /* ---- finale ---- */
  .finale {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 8vw;
    font-family: 'Jolly Lodger', 'IM Fell English', serif;
    font-size: clamp(2rem, 9vmin, 6rem);
    letter-spacing: 0.1em;
    color: #ff3b3b;
    text-shadow: 0 0 12px rgba(255,60,60,0.9), 0 0 30px rgba(220,30,30,0.6), 0 0 60px rgba(180,0,0,0.4);
    opacity: 0;
    filter: blur(10px);
    transition: opacity 1.4s ease, filter 1.4s ease;
    pointer-events: none;
    z-index: 25;
  }
  .finale.show { opacity: 1; filter: blur(0.4px); animation: shimmerRed 3.2s ease-in-out 1.5s infinite; }
  @keyframes shimmerRed {
    0%, 100% { opacity: 1;    text-shadow: 0 0 12px rgba(255,60,60,0.9), 0 0 30px rgba(220,30,30,0.6); }
    50%      { opacity: 0.72; text-shadow: 0 0 20px rgba(255,80,80,1),   0 0 45px rgba(220,30,30,0.8); }
  }

  /* ---- chrome ---- */
  .reset {
    position: fixed;
    right: 3vw;
    bottom: 7vh;
    font-family: 'IM Fell English', serif;
    font-size: clamp(0.85rem, 2vmin, 1.2rem);
    letter-spacing: 0.32em;
    color: #6e6390;
    text-decoration: none;
    border-bottom: 1px solid rgba(150, 120, 220, 0.3);
    padding-bottom: 2px;
    transition: color 0.2s, text-shadow 0.2s, border-color 0.2s;
    z-index: 30;
  }
  .reset:hover {
    color: #b9a4e0;
    text-shadow: 0 0 12px rgba(140, 100, 220, 0.6);
    border-color: rgba(180, 150, 255, 0.7);
  }
  .hint {
    position: fixed;
    right: 3vw;
    bottom: 3vh;
    color: #5e5480;
    font-size: 0.9rem;
    font-style: italic;
    z-index: 30;
  }
  .version {
    position: fixed;
    bottom: 10px;
    right: 14px;
    color: #4a4066;
    font-size: 0.7rem;
    font-family: system-ui, sans-serif;
    z-index: 30;
  }
</style>
</head>
<body>

<h1>The Ectoplasm Engine</h1>

<div class="halo"></div>
<div class="machine" id="machine" role="button" tabindex="0" aria-label="Run the contraption for the next name">
  <video id="machineArt" muted loop playsinline preload="auto" poster="bubble-machine-poster.png" aria-hidden="true">
    <source src="bubble-machine-loop.webm" type="video/webm">
    <source src="bubble-machine-loop.mp4" type="video/mp4">
  </video>
  <div class="fx cauldron-glow"></div>
  <div class="fx puff"></div>
  <div class="fx puff puff2"></div>
</div>


<div class="finale" id="finale">POP!</div>

<a class="reset" href="#" id="resetLink" aria-label="Re-randomise the list">RESET</a>
<p class="hint">Click the contraption for the next name · RESET to start over</p>
<div class="version">v3.1.0</div>

<script>
  const VERSION = '3.1.0';

  // ===== CUSTOMISE MESSAGES HERE =====
  const END_MESSAGE = 'POP!';
  // ===================================

  // ===== BUILT-IN FALLBACK (edit names.json for the shared list) =====
  const ANSWERS = [
    "WARWICK",
    "CHRIS",
    "ADIYA",
    "JENN",
    "CAMILLE",
    "FRANCO",
    "SARA",
    "CHUM",
    "MAYA"
  ];
  // ===================================================================

  const DEFAULTS_URL = 'names.json';
  let names = ANSWERS.slice();

  fetch(DEFAULTS_URL)
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      if (d && Array.isArray(d.names) && d.names.length &&
          JSON.stringify(d.names) !== JSON.stringify(names)) {
        names = d.names;
        randomise();
      }
    })
    .catch(() => {});

  const machine = document.getElementById('machine');
  const machineArt = document.getElementById('machineArt');
  // where on the video frame the wand ring sits (fractions of the video box)
  const RING_FX = 0.921, RING_FY = 0.093;
  const finale = document.getElementById('finale');
  const resetLink = document.getElementById('resetLink');
  finale.textContent = END_MESSAGE;

  let order = [];
  let pos = -1;        // index of last launched name
  let busy = false;    // machine mid-cycle
  let done = false;    // finale shown
  let gen = 0;         // generation counter: invalidates in-flight callbacks on reset
  let docked = 0;
  const floaters = []; // wrapper elements, in launch order

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // where bubbles are born (the wand ring in the artwork),
  // with a fallback for layouts we can't measure
  function wandPoint() {
    const r = machineArt.getBoundingClientRect();
    if (r.width || r.height) return { x: r.left + r.width * RING_FX, y: r.top + r.height * RING_FY };
    return { x: window.innerWidth * 0.3, y: window.innerHeight * 0.55 };
  }

  // where the cluster gathers: top-right corner
  function clusterCentre() {
    return { x: window.innerWidth * 0.855, y: window.innerHeight * 0.17 };
  }
  // arrival point: cluster centre with a little jitter — the physics sim
  // separates the bubbles once they dock
  function slotFor(i) {
    const c = clusterCentre();
    const a = i * 2.399963;
    return { x: c.x + Math.cos(a) * 30, y: c.y + Math.sin(a) * 24 };
  }

  /* --- soap-sud physics: docked bubbles drift to the cluster and bounce
         off each other instead of overlapping --- */
  const sim = { items: [], running: false };

  function simTick() {
    const items = sim.items;
    if (!items.length) { sim.running = false; return; }
    const c = clusterCentre();
    const w = window.innerWidth, h = window.innerHeight;
    for (const b of items) {
      // gentle pull toward the cluster centre
      b.vx += (c.x - b.x) * 0.0016;
      b.vy += (c.y - b.y) * 0.0016;
    }
    // pairwise separation with a bit of bounce
    for (let i = 0; i < items.length; i++) {
      for (let j = i + 1; j < items.length; j++) {
        const a = items[i], d = items[j];
        let dx = d.x - a.x, dy = d.y - a.y;
        let dist = Math.hypot(dx, dy) || 0.01;
        const min = a.r + d.r + 3;
        if (dist < min) {
          const nx = dx / dist, ny = dy / dist;
          const push = (min - dist) * 0.22;
          a.x -= nx * push; a.y -= ny * push;
          d.x += nx * push; d.y += ny * push;
          a.vx -= nx * push * 0.35; a.vy -= ny * push * 0.35;
          d.vx += nx * push * 0.35; d.vy += ny * push * 0.35;
        }
      }
    }
    for (const b of items) {
      b.vx *= 0.90; b.vy *= 0.90;
      b.x += b.vx; b.y += b.vy;
      // keep the cluster in the top-right sky
      b.x = Math.min(w - b.r - 8, Math.max(w * 0.52 + b.r, b.x));
      b.y = Math.min(h * 0.62 - b.r, Math.max(b.r + 8, b.y));
      b.el.style.transform = `translate(${b.x - b.r}px, ${b.y - b.r}px)`;
    }
    requestAnimationFrame(simTick);
  }

  function simAdd(item) {
    sim.items.push(item);
    if (!sim.running && typeof requestAnimationFrame === 'function') {
      sim.running = true;
      requestAnimationFrame(simTick);
    }
  }

  function bubbleSize(name) {
    return Math.min(150, 74 + name.length * 6);
  }

  function spawnBubble(name, index) {
    const myGen = gen;
    const d = bubbleSize(name);
    const wrapEl = document.createElement('div');
    wrapEl.className = 'bub-pos';
    const b = document.createElement('div');
    b.className = 'bubble';
    b.style.width = d + 'px';
    b.style.height = d + 'px';
    const t = document.createElement('div');
    t.className = 'bname';
    t.textContent = name;
    t.style.fontSize = Math.min(d * 0.34, (d * 0.92) / (name.length * 0.55)) + 'px';
    b.appendChild(t);
    wrapEl.appendChild(b);
    document.body.appendChild(wrapEl);
    floaters.push(wrapEl);

    const s = wandPoint();
    const e = slotFor(index);
    const sx = s.x - d / 2, sy = s.y - d / 2;
    const ex = e.x - d / 2, ey = e.y - d / 2;
    const final = `translate(${ex}px, ${ey}px)`;

    function dock() {
      if (myGen !== gen) return;
      wrapEl.style.transform = final;
      b.classList.add('docked');
      b.style.animationDelay = (Math.random() * -4) + 's';
      // hand over to the sud physics: arrive with a little momentum
      simAdd({
        el: wrapEl, x: e.x, y: e.y, r: d / 2,
        vx: (Math.random() - 0.5) * 3, vy: -1 - Math.random() * 2,
      });
      docked++;
      maybeFinale();
    }

    if (wrapEl.animate) {
      // drifting float: wobble fades as it nears its slot
      const N = 12;
      const frames = [];
      for (let k = 0; k <= N; k++) {
        const p = k / N;
        const q = p * p * (3 - 2 * p); // smoothstep
        const wob = Math.sin(p * Math.PI * 3.2) * 42 * (1 - p);
        const lift = -Math.sin(p * Math.PI) * window.innerHeight * 0.05;
        frames.push({ transform: `translate(${sx + (ex - sx) * q + wob}px, ${sy + (ey - sy) * q + lift}px)` });
      }
      const anim = wrapEl.animate(frames, { duration: 3800 + Math.random() * 1000, easing: 'linear', fill: 'forwards' });
      // cancel the filled animation on arrival — its forward-fill would
      // override the inline transforms the sud physics writes
      anim.onfinish = () => { anim.cancel(); dock(); };
    } else {
      dock();
    }
  }

  function maybeFinale() {
    if (done || gen < 0) return;
    if (pos === order.length - 1 && docked === order.length) {
      const myGen = gen;
      done = true;
      setTimeout(() => {
        if (myGen !== gen) return;
        floaters.forEach((w, i) => {
          setTimeout(() => {
            if (myGen !== gen) return;
            sim.items = sim.items.filter(it => it.el !== w); // freeze it where it floats
            const b = w.querySelector('.bubble');
            b.classList.remove('docked');
            b.classList.add('popping');
            setTimeout(() => w.remove(), 340);
          }, i * 130);
        });
        setTimeout(() => { if (myGen === gen) finale.classList.add('show'); }, floaters.length * 130 + 500);
      }, 1100);
    }
  }

  function runCycle(onLaunch) {
    machine.classList.remove('run');
    void machine.getBoundingClientRect(); // restart animations
    machine.classList.add('run');
    // the contraption cranks up just long enough to blow one bubble
    try { const p = machineArt.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
    setTimeout(onLaunch, 1780);
    setTimeout(() => {
      machine.classList.remove('run');
      try { machineArt.pause(); } catch (e) {}
      busy = false;
    }, 2150);
  }

  function next() {
    if (busy || done || order.length === 0) return;
    if (pos >= order.length - 1) return; // all launched
    busy = true;
    pos = pos + 1;
    const name = order[pos];
    const index = pos;
    runCycle(() => spawnBubble(name, index));
  }

  function randomise() {
    gen++;
    document.querySelectorAll('.bub-pos').forEach(el => el.remove());
    floaters.length = 0;
    sim.items = [];
    order = shuffle(names);
    pos = -1;
    docked = 0;
    busy = false;
    done = false;
    finale.classList.remove('show');
    machine.classList.remove('run');
    try { machineArt.pause(); } catch (e) {}
  }

  machine.addEventListener('click', next);
  machine.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); }
  });
  resetLink.addEventListener('click', (e) => { e.preventDefault(); if (!busy) randomise(); });

  order = shuffle(names);
</script>

</body>
</html>
